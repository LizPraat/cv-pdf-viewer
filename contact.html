
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Me</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 28px;
      background: #ffffff;
      color: #333333;
      font-family: Arial, sans-serif;
    }

    .contact-form {
      max-width: 760px;
      margin: 0 auto;
    }

    .name-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
    }

    .field { margin-bottom: 22px; }

    label {
      display: block;
      margin-bottom: 9px;
      font-size: 15px;
      font-weight: 400;
    }

    input, textarea {
      display: block;
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #cfcfcf;
      border-radius: 0;
      background: #fff;
      color: #333;
      font: inherit;
      font-size: 15px;
    }

    input { height: 47px; }

    textarea {
      min-height: 190px;
      resize: vertical;
    }

    input:focus, textarea:focus {
      outline: 2px solid #777;
      outline-offset: 1px;
    }

    button {
      padding: 13px 28px;
      border: 1px solid #555;
      border-radius: 0;
      background: #fff;
      color: #333;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #f3f3f3;
    }

    @media (max-width: 520px) {
      body { padding: 18px; }
      .name-row { grid-template-columns: 1fr; gap: 0; }
    }
  </style>
</head>
<body>
  <form class="contact-form"
        action="https://formspree.io/f/xrpewpol"
        method="POST">

    <div class="name-row">
      <div class="field">
        <label for="first-name">First Name *</label>
        <input id="first-name" name="first_name"
               type="text" autocomplete="given-name" required>
      </div>

      <div class="field">
        <label for="last-name">Last Name *</label>
        <input id="last-name" name="last_name"
               type="text" autocomplete="family-name" required>
      </div>
    </div>

    <div class="field">
      <label for="email">Email Address *</label>
      <input id="email" name="email" type="email"
             autocomplete="email" required>
    </div>

    <div class="field">
      <label for="message">Comment or Message *</label>
      <textarea id="message" name="message" required></textarea>
    </div>

    <button type="submit">Submit</button>
  </form>
</body>
</html>
