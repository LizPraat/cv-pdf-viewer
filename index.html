
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academic CV Viewer</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
    }
    #adobe-dc-view {
      width: 100%;
      height: 100vh;
    }
  </style>
  <script src="https://acrobatservices.adobe.com/view-sdk/viewer.js"></script>
</head>
<body>
  <div id="adobe-dc-view"></div>
  <script>
    document.addEventListener("adobe_dc_view_sdk.ready", function () {
      const adobeDCView = new AdobeDC.View({
        clientId: "7ffaf68f506b436bba9773dee1904a05",
        divId: "adobe-dc-view"
      });

      adobeDCView.previewFile({
        content: {
          location: {
            url: "https://cvviewer.lizannethornton.com/cv.pdf"
          }
        },
        metaData: {
          fileName: "Academic CV.pdf"
        }
      }, {
        embedMode: "FULL_WINDOW",
        defaultViewMode: "FIT_PAGE",
        showThumbnails: true,
        showBookmarks: true
      });
    });
  </script>
</body>
</html>
